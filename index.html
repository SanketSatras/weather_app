<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Dark Weather App</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* Base Styles */
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b); /* Darker, more cohesive gradient */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto; /* Allow vertical scrolling */
            color: #e2e8f0; /* Default text color for dark theme */
        }

        /* Main Container - Now centers the single panel */
        .main-container {
            display: flex;
            justify-content: center; /* Center the single panel */
            align-items: flex-start;
            max-width: 800px; /* Max width for a single panel */
            width: 100%;
            padding: 0; /* Remove gap as there's only one item */
        }

        /* Right Panel - Now the main and only panel */
        .right-panel {
            flex: 1; /* Takes full available space */
            min-width: 400px; /* Minimum width for the panel */
            background-color: #2d3748; /* Slightly lighter dark background */
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .right-panel h1 {
            font-size: 2.5em;
            font-weight: 800;
            color: #a7d3f2;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.1);
        }
        .right-panel h1 img {
            width: 50px;
            height: 50px;
        }

        /* Input Group */
        .input-group {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .input-group input {
            flex: 3;
            padding: 16px 20px;
            border: 2px solid #4a5568; /* Darker border */
            border-radius: 12px;
            font-size: 1.1em;
            outline: none;
            background-color: #2d3748; /* Input background */
            color: #e2e8f0; /* Input text color */
            box-shadow: inset 0 3px 6px rgba(0, 0, 0, 0.2);
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            min-width: 200px;
        }

        .input-group input::placeholder {
            color: #94a3b8;
        }

        .input-group input:focus {
            border-color: #63b3ed; /* Brighter blue on focus */
            box-shadow: inset 0 3px 6px rgba(0, 0, 0, 0.3), 0 0 0 4px rgba(99, 179, 237, 0.4);
        }

        .input-group button {
            flex: 1;
            background-color: #4299e1; /* Blue button */
            color: white;
            padding: 16px 25px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease, box-shadow 0.3s ease;
            font-size: 1.1em;
            border: none;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
            min-width: 120px;
        }

        .input-group button:hover {
            background-color: #3182ce;
            transform: translateY(-3px);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.45);
        }

        .input-group button:active {
            transform: translateY(0);
            box-shadow: 0 5px 12px rgba(0, 0, 0, 0.25);
        }

        /* Weather Display */
        .weather-info-dynamic {
            margin-top: 20px;
            padding-top: 25px;
            border-top: 1px solid #4a5568; /* Darker separator */
            text-align: center;
        }

        .weather-info-dynamic #icon {
            width: 120px;
            height: 120px;
            margin-bottom: 15px;
        }

        .weather-info-dynamic #location {
            font-size: 2.2em;
            font-weight: 700;
            color: #a7d3f2;
            margin-bottom: 5px; /* Adjusted margin */
        }
        
        .weather-info-dynamic #datetime { /* New style for datetime */
            font-size: 1em;
            color: #94a3b8;
            margin-bottom: 15px; /* Adjusted margin */
        }

        .weather-info-dynamic #description {
            font-size: 1.4em;
            color: #cbd5e0;
            margin-bottom: 25px;
            text-transform: capitalize;
        }

        .weather-info-dynamic #temperature {
            font-size: 5em;
            font-weight: 800;
            color: #63b3ed;
            margin-bottom: 30px;
            letter-spacing: -2px;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.1);
        }

        .weather-info-dynamic .detail-item {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 30px;
            font-size: 1.2em;
            color: #cbd5e0;
            flex-wrap: wrap;
        }

        .weather-info-dynamic .detail-item p {
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
        }

        /* Air Quality Display */
        #airQualityDisplay {
            margin-top: 35px;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            transition: background-color 0.3s ease, border-color 0.3s ease;
            background-color: #2c3645; /* Dark background */
            border: 1px solid #4a5568;
        }

        #airQualityDisplay p {
            margin-bottom: 8px;
            color: #e2e8f0;
        }

        #airQualityDisplay p:first-child {
            font-weight: 700;
            font-size: 1.4em;
            color: #a7d3f2;
        }

        #aqiValue {
            font-size: 3em;
            font-weight: 800;
            margin-bottom: 10px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        #aqiDescription {
            font-size: 1.3em;
            font-weight: 600;
            margin-bottom: 20px;
        }

        #airQualityDisplay ul {
            list-style-type: none;
            padding-left: 0;
            margin: 0 auto;
            max-width: 300px;
            font-size: 0.95em;
            color: #94a3b8;
            text-align: left;
            margin-top: 15px;
        }

        #airQualityDisplay ul li {
            margin-bottom: 5px;
            position: relative;
            padding-left: 20px;
        }

        #airQualityDisplay ul li::before {
            content: '•';
            position: absolute;
            left: 0;
            top: 0;
            font-size: 1.2em;
            line-height: 1;
        }

        /* AQI Specific Backgrounds and Colors (Dark Theme Adapted) */
        .aqi-good {
            background-color: #1a4731; /* Darker green */
            border: 1px solid #34d399; /* Green-500 */
        }
        .aqi-good #aqiValue, .aqi-good #aqiDescription {
            color: #68d391; /* Lighter green */
        }
        .aqi-good ul li, .aqi-good ul li::before {
            color: #a7f3d0; /* Lighter green */
        }

        .aqi-moderate {
            background-color: #5a4b15; /* Darker yellow/orange */
            border: 1px solid #facc15; /* Yellow-500 */
        }
        .aqi-moderate #aqiValue, .aqi-moderate #aqiDescription {
            color: #fbbf24; /* Lighter yellow */
        }
        .aqi-moderate ul li, .aqi-moderate ul li::before {
            color: #fcd34d; /* Lighter yellow */
        }

        .aqi-poor {
            background-color: #6b2e2e; /* Darker red */
            border: 1px solid #ef4444; /* Red-500 */
        }
        .aqi-poor #aqiValue, .aqi-poor #aqiDescription {
            color: #f87171; /* Lighter red */
        }
        .aqi-poor ul li, .aqi-poor ul li::before {
            color: #fca5a5; /* Lighter red */
        }

        /* Forecast Section */
        .forecast-section {
            padding: 30px;
            border-radius: 20px;
            background-color: #2c3645; /* Dark background */
            border: 1px solid #4a5568;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .forecast-section h3 {
            font-size: 2em;
            font-weight: 700;
            margin-bottom: 25px;
            color: #a7d3f2;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.05);
        }

        .forecast-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); /* Adjusted for dark cards */
            gap: 20px;
            justify-content: center;
        }

        .forecast-card {
            background-color: #3b475c; /* Slightly lighter dark for cards */
            padding: 18px;
            border-radius: 15px;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid #5c6c8c;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            text-align: center;
        }

        .forecast-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.25);
        }

        .forecast-card img {
            width: 80px;
            height: 80px;
            margin-bottom: 5px;
        }

        .forecast-card p {
            margin: 4px 0;
            font-size: 1.1em;
            color: #e2e8f0;
        }
        .forecast-card p:first-child {
            font-size: 1.25em;
            font-weight: 700;
            color: #a7d3f2;
        }
        .forecast-card p:nth-child(2) {
            font-size: 0.95em;
            color: #94a3b8;
        }
        .forecast-card p:nth-child(4) {
            font-size: 1em;
            font-weight: 500;
            color: #cbd5e0;
        }
        .forecast-card p:last-child {
            font-size: 1.4em;
            font-weight: 700;
            color: #63b3ed;
            margin-top: 10px;
        }

        /* Message Box */
        .message-box {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            z-index: 1000;
            padding: 1.5rem 3.5rem;
            border-radius: 1rem;
            color: white;
            opacity: 0;
            transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 1.2rem;
            font-size: 1.3rem;
            min-width: 280px;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }

        .message-box.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .message-box.error {
            background-color: #dc2626; /* Darker red */
        }
        .message-box.success {
            background-color: #16a34a; /* Darker green */
        }

        /* Utility Classes */
        .hidden {
            display: none;
        }

        /* Custom Animations */
        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.9) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes bounceIn {
            0% { opacity: 0; transform: scale(0.2); }
            50% { opacity: 1; transform: scale(1.2); }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .weather-info-enter { animation: fadeInScale 1s ease-out forwards; }
        .weather-detail-animation { animation: fadeInDown 0.8s ease-out forwards; }
        .weather-icon-animation { animation: bounceIn 1.1s cubic-bezier(0.68, -0.55, 0.27, 1.55) forwards; }
        .insight-animation { animation: fadeIn 1s ease-out forwards; }


        /* Responsive Adjustments */
        @media (max-width: 1024px) {
            .main-container {
                padding: 0; /* No need for flex-direction: column as there's only one panel */
            }
            .right-panel {
                min-width: unset; /* Allow panel to shrink */
                width: 95%; /* Take almost full width */
                max-width: 600px; /* Max width for single panel */
                padding: 30px;
                border-radius: 18px;
            }

            .right-panel h1 {
                font-size: 2.2em;
            }
            .weather-info-dynamic #temperature {
                font-size: 4.5em;
            }
            .forecast-grid {
                grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 15px;
            }
            .right-panel {
                padding: 25px;
                border-radius: 15px;
            }

            .right-panel h1 {
                font-size: 2em;
                gap: 10px;
            }
            .right-panel h1 img {
                width: 40px;
                height: 40px;
            }

            .input-group {
                flex-direction: column;
                gap: 10px;
            }
            .input-group input, .input-group button {
                padding: 12px 15px;
                font-size: 1em;
            }

            .weather-info-dynamic #location {
                font-size: 1.8em;
            }
            .weather-info-dynamic #description {
                font-size: 1.2em;
            }
            .weather-info-dynamic #temperature {
                font-size: 4em;
            }
            .weather-info-dynamic .detail-item {
                font-size: 1.1em;
                gap: 20px;
            }

            .forecast-section h3 {
                font-size: 1.8em;
                margin-bottom: 20px;
            }
            .forecast-grid {
                grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
                gap: 15px;
            }
            .forecast-card {
                padding: 15px;
            }
            .forecast-card img {
                width: 60px;
                height: 60px;
            }
            .forecast-card p {
                font-size: 0.95em;
            }
            .forecast-card p:last-child {
                font-size: 1.1em;
            }
            .message-box {
                font-size: 1em;
                padding: 1rem 2rem;
                gap: 0.8rem;
                width: 90%;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            .right-panel {
                padding: 20px;
                border-radius: 12px;
                gap: 20px;
            }

            .right-panel h1 {
                font-size: 1.8em;
            }
            .weather-info-dynamic #temperature {
                font-size: 3.5em;
            }
            .weather-info-dynamic .detail-item {
                flex-direction: column;
                gap: 10px;
            }
            .forecast-grid {
                grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
                gap: 10px;
            }
            .forecast-card img {
                width: 50px;
                height: 50px;
            }
            .forecast-card p {
                font-size: 0.95em;
            }
            .message-box {
                font-size: 0.8em;
                padding: 0.8rem 1.2rem;
                gap: 0.5rem;
            }
        }
    </style>
</head>

<body>

    <div id="messageBox" class="message-box"></div>

    <div class="main-container">
        <div class="right-panel">
            <h1>
                Weather App
                <img src="https://openweathermap.org/img/wn/04d@2x.png" alt="Cloud icon">
            </h1>

            <div class="input-group">
                <input
                    type="text"
                    id="city"
                    placeholder="Enter city name..."
                    aria-label="City input"
                />
                <button
                    onclick="getWeather()"
                    aria-label="Get weather"
                >
                    Search
                </button>
            </div>

            <div id="weatherDisplay" class="hidden weather-info-dynamic">
                <img id="icon" src="" alt="Weather Icon" class="weather-icon-animation">
                <h2 id="location" class="weather-info-enter"></h2>
                <p id="datetime" class="weather-detail-animation"></p> <p id="description" class="weather-detail-animation"></p>
                <p id="temperature" class="weather-info-enter"></p>
                <div class="detail-item">
                    <p id="humidity" class="weather-detail-animation">💧 Humidity: --%</p>
                    <p id="wind" class="weather-detail-animation">🌬️ Wind Speed: -- m/s</p>
                </div>

                <div id="airQualityDisplay" class="hidden insight-animation">
                    <p>Air Quality Index (AQI):</p>
                    <p id="aqiValue"></p>
                    <p id="aqiDescription"></p>
                    <div>
                        <p style="font-weight: bold;">AQI Scale:</p>
                        <ul>
                            <li style="color: #68d391;">1-2: Good / Fair</li>
                            <li style="color: #fbbf24;">3: Moderate</li>
                            <li style="color: #f87171;">4-5: Poor / Very Poor</li>
                        </ul>
                    </div>
                </div>

                <div id="forecastDisplay" class="hidden forecast-section insight-animation">
                    <h3>8-Day Forecast</h3>
                    <div id="forecastContainer" class="forecast-grid">
                        </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const apiKey = "8d60db9c361b0ba43296ec819d02a0cc"; // Your OpenWeatherMap API Key
        const apiUrl = "https://api.openweathermap.org/data/2.5/weather?q=";
        const airPollutionApiUrl = "https://api.openweathermap.org/data/2.5/air_pollution?";
        const oneCallApiUrl = "https://api.openweathermap.org/data/3.0/onecall?";

        const weatherDisplay = document.getElementById("weatherDisplay");
        const messageBox = document.getElementById("messageBox");
        const airQualityDisplay = document.getElementById("airQualityDisplay");
        const aqiValueElement = document.getElementById("aqiValue");
        const aqiDescriptionElement = document.getElementById("aqiDescription");
        const forecastDisplay = document.getElementById("forecastDisplay");
        const forecastContainer = document.getElementById("forecastContainer");
        const dateTimeElement = document.getElementById("datetime"); // Get the new element

        // Function to show custom messages
        function showMessage(message, type = 'error') {
            messageBox.innerText = message;
            messageBox.className = 'message-box'; // Reset to base class
            messageBox.classList.add('show', type);
            setTimeout(() => {
                messageBox.classList.remove('show');
            }, 3000);
        }

        function getAqiDescription(aqi) {
            switch (aqi) {
                case 1: return "Good";
                case 2: return "Fair";
                case 3: return "Moderate";
                case 4: return "Poor";
                case 5: return "Very Poor";
                default: return "N/A";
            }
        }

        function getAqiColorClass(aqi) {
            switch (aqi) {
                case 1:
                case 2: return "aqi-good";
                case 3: return "aqi-moderate";
                case 4:
                case 5: return "aqi-poor";
                default: return "";
            }
        }

        // Function to format date and time
        function formatDateTime(timestamp, timezoneOffsetSeconds) {
            // Create a date object from the Unix timestamp
            const date = new Date(timestamp * 1000);

            // Calculate the local time considering the city's timezone offset
            // Get the UTC time in milliseconds
            const utcTime = date.getTime() + (date.getTimezoneOffset() * 60 * 1000);
            // Add the city's timezone offset (in milliseconds)
            const cityLocalTime = new Date(utcTime + (timezoneOffsetSeconds * 1000));

            const options = {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                hour12: true
            };
            return cityLocalTime.toLocaleString('en-US', options);
        }

        async function getAirQuality(lat, lon) {
            airQualityDisplay.classList.add("hidden");
            try {
                const response = await fetch(`${airPollutionApiUrl}lat=${lat}&lon=${lon}&appid=${apiKey}`);
                const data = await response.json();
                if (data.list && data.list.length > 0) {
                    const aqi = data.list[0].main.aqi;
                    const aqiDescription = getAqiDescription(aqi);
                    const aqiColorClass = getAqiColorClass(aqi);

                    aqiValueElement.innerText = aqi;
                    aqiDescriptionElement.innerText = aqiDescription;

                    airQualityDisplay.classList.remove("aqi-good", "aqi-moderate", "aqi-poor");
                    if (aqiColorClass) {
                        airQualityDisplay.classList.add(aqiColorClass);
                    }
                    airQualityDisplay.classList.remove("hidden");
                    airQualityDisplay.classList.add("insight-animation");
                } else {
                    airQualityDisplay.classList.add("hidden");
                }
            } catch (error) {
                console.error("Error fetching air quality data:", error);
                airQualityDisplay.classList.add("hidden");
            }
        }

        async function getForecast(lat, lon) {
            forecastDisplay.classList.add("hidden");
            forecastContainer.innerHTML = '';

            try {
                const response = await fetch(`${oneCallApiUrl}lat=${lat}&lon=${lon}&exclude=current,minutely,hourly,alerts&appid=${apiKey}&units=metric`);
                const data = await response.json();

                if (data.daily && data.daily.length > 0) {
                    const dailyForecasts = data.daily.slice(0, 8); // Still 8 days for dynamic panel

                    dailyForecasts.forEach((day, index) => {
                        const date = new Date(day.dt * 1000);
                        const dayOfWeek = date.toLocaleDateString('en-US', { weekday: 'short' });
                        const formattedDate = date.toLocaleDateString('en-US', { month: 'numeric', day: 'numeric' });
                        const iconCode = day.weather[0].icon;
                        const description = day.weather[0].description;
                        const minTemp = Math.round(day.temp.min);
                        const maxTemp = Math.round(day.temp.max);

                        const forecastCard = document.createElement('div');
                        forecastCard.className = 'forecast-card';
                        forecastCard.innerHTML = `
                            <p>${index === 0 ? 'Today' : dayOfWeek}</p>
                            <p>${formattedDate}</p>
                            <img src="https://openweathermap.org/img/wn/${iconCode}@2x.png" alt="${description}">
                            <p>${description}</p>
                            <p>${maxTemp}°C / ${minTemp}°C</p>
                        `;
                        forecastContainer.appendChild(forecastCard);
                    });
                    forecastDisplay.classList.remove("hidden");
                    forecastDisplay.classList.add("insight-animation");
                } else {
                    forecastDisplay.classList.add("hidden");
                }
            } catch (error) {
                console.error("Error fetching forecast data:", error);
                forecastDisplay.classList.add("hidden");
            }
        }

        async function getWeather() {
            const city = document.getElementById("city").value.trim();

            if (city === "") {
                showMessage("Please enter a city name!", "error");
                // Ensure weather display remains hidden if input is empty
                weatherDisplay.classList.add("hidden");
                airQualityDisplay.classList.add("hidden");
                forecastDisplay.classList.add("hidden");
                return;
            }

            // Hide previous data while fetching new data
            weatherDisplay.classList.add("hidden");
            airQualityDisplay.classList.add("hidden");
            forecastDisplay.classList.add("hidden");
            showMessage(`Fetching weather for ${city}...`, "success");

            try {
                const response = await fetch(`${apiUrl}${city}&appid=${apiKey}&units=metric`);
                const data = await response.json();

                if (data.cod !== 200) {
                    showMessage("City not found or API issue. Please try again with a valid city.", "error");
                    return;
                }

                // Update the weather display
                const elementsToAnimate = [
                    document.getElementById("location"),
                    document.getElementById("datetime"), // Add new element to animation list
                    document.getElementById("description"),
                    document.getElementById("temperature"),
                    document.getElementById("humidity"),
                    document.getElementById("wind"),
                    document.getElementById("icon")
                ];

                elementsToAnimate.forEach(el => {
                    el.classList.remove("weather-info-enter", "weather-detail-animation", "weather-icon-animation");
                    void el.offsetWidth; // Trigger reflow
                });

                document.getElementById("location").innerText = `${data.name}, ${data.sys.country}`;
                // Set current date and time using the city's timezone offset
                dateTimeElement.innerText = formatDateTime(data.dt, data.timezone); 
                document.getElementById("description").innerText = data.weather[0].description;
                document.getElementById("temperature").innerText = `🌡️ ${Math.round(data.main.temp)}°C`;
                document.getElementById("humidity").innerText = `💧 Humidity: ${data.main.humidity}%`;
                document.getElementById("wind").innerText = `🌬️ Wind Speed: ${data.wind.speed} m/s`;
                document.getElementById("icon").src = `https://openweathermap.org/img/wn/${data.weather[0].icon}@2x.png`;
                document.getElementById("icon").alt = `Weather icon for ${data.weather[0].description}`;

                weatherDisplay.classList.remove("hidden");

                setTimeout(() => {
                    document.getElementById("location").classList.add("weather-info-enter");
                    document.getElementById("datetime").classList.add("weather-detail-animation"); // Animate datetime
                    document.getElementById("temperature").classList.add("weather-info-enter");
                    document.getElementById("description").classList.add("weather-detail-animation");
                    document.getElementById("humidity").classList.add("weather-detail-animation");
                    document.getElementById("wind").classList.add("weather-detail-animation");
                    document.getElementById("icon").classList.add("weather-icon-animation");
                }, 50);

                await getAirQuality(data.coord.lat, data.coord.lon);
                await getForecast(data.coord.lat, data.coord.lon);

            } catch (error) {
                console.error("Error fetching data:", error);
                showMessage("Failed to fetch weather data. Please check your internet connection.", "error");
            }
        }


        // Allow pressing "Enter" to trigger search
        document.getElementById("city").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                getWeather();
            }
        });

        // Initialize on load - NO initial weather fetch
        document.addEventListener("DOMContentLoaded", () => {
             // You can set a default placeholder city here if you want, but no auto-fetch
             document.getElementById("city").value = ""; // Empty on load
        });
    </script>
</body>
</html>
